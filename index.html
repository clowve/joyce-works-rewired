<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JOYCE.WORKS — Landing Rebuild</title>

  <meta
    name="description"
    content="Staging rebuild of the Joyce Works landing experience."
  >

  <link rel="stylesheet" href="css/landing.css?v=20261102-identity3">
</head>

<body>
  <!--
    JOYCE.WORKS — REWIRED
    GitHub staging shell.

    IMPORTANT:
    This menu is persistent site chrome. Keep it outside
    every scroll-driven landing scene.

    Tumblr migration:
    restore the dynamic {block:HasPages}, Ask and Submit
    entries only when this staging build is moved home.
  -->
  <div class="site-menu">
    <input
      class="site-menu-toggle"
      type="checkbox"
      id="ShowMenu"
      aria-label="Toggle menu"
    >

    <nav id="menu" class="site-menu-panel" aria-label="Site menu">
      <h3>Menu</h3>

      <ul>
        <li><a href="#identity">Home</a></li>
        <li><a href="https://joyce.works/hard">Work</a></li>
        <li><a href="https://joyce.works/yo">Say hello</a></li>
      </ul>
    </nav>

    <label
      class="site-menu-button"
      for="ShowMenu"
      aria-hidden="true"
    >
      <span></span>
    </label>
  </div>

  <main id="landing-v2">
    <!--
      Scene A
      Identity / reveal.

      Planned states:
      1. Psychedelic opening
      2. Stable JOYCE WORKS
      3. Pink identity state
      4. Portrait masked into wordmark
      5. Portrait + biography reveal
    -->
    <section
      id="identity"
      class="landing-scene identity-scene"
      aria-label="Joyce Works introduction"
      data-identity-scene
    >
      <div class="identity-stage">

        <!--
          Temporary reference layer:
          keep the original animated opening while we rebuild
          the visual system underneath it piece by piece.
        -->
        <div
          class="identity-layer identity-opening"
          aria-hidden="true"
        ></div>

        <!--
          First genuinely web-native state.
          This slides up over the opening as the user scrolls.
        -->
        <div
          class="identity-wipe identity-wipe--wordmark"
          data-identity-wipe
          data-wipe-start="0"
          data-wipe-end="0.5"
          aria-hidden="true"
        >
          <div
            class="identity-wipe-content identity-wordmark-state"
            data-identity-wipe-content
          >
            <img
              class="jw-mark"
              src="assets/identity/joyce-works-mark.svg"
              alt="Joyce Works"
            >
          </div>
        </div>

        <!--
          State 3:
          native pink field + the canonical JOYCE WORKS SVG used as
          a mask. The old composed JPEG is only a temporary portrait
          calibration source and will be replaced by the clean photo.
        -->
        <div
          class="identity-wipe identity-wipe--portrait"
          data-identity-wipe
          data-wipe-start="0.5"
          data-wipe-end="1"
          aria-hidden="true"
        >
          <div class="identity-wipe-content identity-portrait-state">
            <div class="identity-portrait-mask"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- Scene B — Advertising / Strategy / Art -->
    <section
      id="disciplines"
      class="landing-scene disciplines-scene"
      aria-label="Disciplines"
    ></section>

    <!-- Scene C — Client history -->
    <section
      id="clients"
      class="landing-scene clients-scene"
      aria-label="Clients"
    ></section>

    <!-- Scene D — Portfolio / contact -->
    <section
      id="contact"
      class="landing-scene cta-scene"
      aria-label="Portfolio and contact"
    ></section>
  </main>

  <script src="js/landing.js?v=20261102-identity3"></script>
</body>
</html>
