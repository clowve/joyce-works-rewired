<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JOYCE.WORKS — Opener WebGL2 Prototype</title>
  <meta name="description" content="Isolated WebGL2 opener motion prototype for JOYCE.WORKS.">
  <link rel="stylesheet" href="opener.css?v=20261103-3">
</head>
<body>
  <main class="opener-prototype" data-opener-prototype>
    <section class="opener-scroll">
      <div class="opener-stage">
        <div class="opener-fallback" aria-hidden="true"></div>

        <canvas class="opener-canvas" data-opener-canvas aria-hidden="true"></canvas>

        <div class="opener-brand" aria-hidden="true">
          <div class="opener-brand-ghost">
            <img src="../../assets/identity/joyce-works-outline.svg?v=20261103-pad1" alt="">
          </div>

          <div class="opener-brand-draw" data-brand-draw></div>

          <img
            class="opener-brand-fill"
            data-brand-fill
            src="../../assets/identity/joyce-works-mark.svg"
            alt=""
          >
        </div>

        <div class="opener-black-veil" data-black-veil aria-hidden="true"></div>

        <div class="prototype-note" aria-hidden="true">
          <span>WEBGL2 OPENER / V1</span>
          <span>MOVE CURSOR · SCROLL</span>
        </div>
      </div>
    </section>
  </main>

  <script src="opener.js?v=20261103-15"></script>

</html>
